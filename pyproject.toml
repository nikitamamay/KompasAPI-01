[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "KompasAPI-01"
version = "0.0.1"
dependencies = [
  "pywin32",
]
requires-python = ">=3.11"
authors = [
  {name = "Nikita Mamay", email = "nikitamamay@mail.ru"},
]
maintainers = [
  {name = "Nikita Mamay", email = "nikitamamay@mail.ru"},
]
description = "Библиотека-обертка для API САПР «Компас-3D», включающая stub-файлы с аннотациями типов и документацией из Справки SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["cad", "kompas3d", "kompas-3d"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/nikitamamay/KompasAPI-01"
